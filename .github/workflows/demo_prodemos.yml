# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
# More info on Python, GitHub Actions, and Azure App Service: https://aka.ms/python-webapps-actions

name: Build and deploy Python app to Azure Web App - prodemos

on:
  push:
    branches:
      - demo
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout the code from the repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Set up the required Python version
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Create and activate virtual environment
      - name: Create and activate virtual environment
        run: |
          python -m venv venv
          source venv/bin/activate

      # Install dependencies from requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt

      # Run collectstatic for Django (or other frameworks)
      - name: Collect static files
        run: python manage.py collectstatic --noinput

      # Optional: Add step to run tests (e.g., PyTest, Django test suites)
      # - name: Run tests
      #   run: pytest

      # Create a zip artifact for deployment
      - name: Create deployment artifact
        run: zip -r release.zip ./* -x venv/*

      # Upload the artifact for the deploy job
      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write  # Required for requesting the JWT
      contents: read   # Required for actions/checkout

    steps:
      # Download the artifact from the build job
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: python-app

      # Login to Azure using Service Principal credentials
      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_8A9C435EFFF240479C25B2C91631CCAF }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_A3660F0FDD4940B69A99DEE0088DD7D7 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_528DAE8C9B2D4843BB5D30647A78FC98 }}

      # Deploy the app to Azure Web App
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'prodemos'
          slot-name: 'Production'
